name: CI and Build

# The previous workflow deployed with docker compose, but this repo has no docker-compose.yml
# (and it referenced unrelated secrets). It now tests the backend and builds the React frontend.
# Add a deploy job here once a hosting target is chosen.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      # Live tests (real Google API calls) are excluded from CI.
      - run: python -m pytest -m "not live"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
