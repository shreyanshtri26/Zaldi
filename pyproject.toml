[project]
name = "zaldi"
version = "1.0.0"
description = "Agentic AI for e-commerce: a shopping assistant for any online shop, with an admin portal (Flask API + React frontend)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider"
markers = ["live: calls external APIs (needs GOOGLE_API_KEY and quota); deselect with -m 'not live'"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP"]
